<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Printer | ATC FabLab</title>
    <style>
        body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f5f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; max-width: 600px; width: 100%; border-radius: 25px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); box-sizing: border-box; text-align: center; }
        .back-nav { text-align: left; margin-bottom: 20px; }
        .back-nav a { text-decoration: none; color: #888; font-size: 0.9rem; font-weight: 500; cursor: pointer; }
        h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; }
        .rules-card { background-color: #fffbeb; border: 2px solid #fcd34d; border-radius: 12px; padding: 25px; margin-bottom: 30px; text-align: left; }
        .rules-card h2 { margin-top: 0; font-size: 1.1rem; color: #92400e; font-weight: 800; }
        .rules-card ul { padding-left: 18px; margin: 0; color: #92400e; font-size: 0.85rem; line-height: 1.5; }
        .rules-card li { margin-bottom: 12px; }
        input[type="date"], .text-input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e5e7eb; box-sizing: border-box; margin-bottom: 15px; font-size: 1rem; font-family: inherit; }
        
        /* Checkbox & Partner Field Styling */
        .checkbox-container { display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-bottom: 15px; text-align: left; font-weight: 600; font-size: 0.95rem; color: #374151; }
        .checkbox-container input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #000; }
        .partner-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px 15px 5px 15px; margin-bottom: 15px; text-align: left; display: none; }
        .partner-box label { font-size: 0.8rem; font-weight: 800; color: #6b7280; text-transform: uppercase; display: block; margin-bottom: 8px; }

        .slot-header { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; margin-bottom: 10px; }
        .slot-label { font-size: 0.75rem; font-weight: 800; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; }
        .clear-all { font-size: 0.75rem; font-weight: 700; color: #374151; background: #f3f4f6; border: none; padding: 4px 12px; border-radius: 20px; cursor: pointer; }
        .lockout-notice { color: #ef4444; font-size: 0.7rem; margin-top: -5px; margin-bottom: 15px; text-align: left; }
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .time-slot { position: relative; padding: 18px 5px; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.8rem; text-align: center; transition: 0.1s; background: #fff; display: flex; align-items: center; justify-content: center; }
        .time-slot.selected { background: #000 !important; color: #fff !important; border-color: #000 !important; }
        .time-slot.locked { opacity: 0.3; pointer-events: none; background: #f9fafb; cursor: not-allowed; }
        .time-slot.reserved { background-color: #e2e8f0; color: #94a3b8; text-decoration: line-through; cursor: not-allowed; border: 1px solid #cbd5e1; pointer-events: none; }
        .clay-badge { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background: #f59e0b; color: white; font-size: 0.6rem; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; white-space: nowrap; z-index: 10; }
        .primary-btn { background: #000; color: white; border: none; width: 100%; padding: 18px; border-radius: 35px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 20px; }
        .secondary-btn { background: #fff; color: #888; border: 1px solid #e5e7eb; width: 100%; padding: 12px; border-radius: 35px; font-weight: 500; font-size: 0.85rem; cursor: pointer; margin-top: 15px; }
        .booking-item { border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-align: left; background: #fff; }
        .cancel-btn { background: #fee2e2; color: #b91c1c; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
        #form-container, #manage-view { display: none; }
        @media (max-width: 480px) { .time-grid { grid-template-columns: repeat(2, 1fr); } }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Rules Overlay Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-content h3 {
            margin-top: 0;
            font-size: 1.4rem;
            color: #111827;
        }
        .modal-content p {
            font-size: 0.95rem;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="booking-view">
            <div class="back-nav"><a href="index.html">← Back to Selection</a></div>
            <h1 id="printer-title">Reserve Printer</h1>
            <div class="rules-card">
                <h2>Read Before Booking</h2>
                <ul id="rules-list"></ul>
            </div>
            <input type="date" id="date-picker">
            <div id="slot-container" style="display:none;">
                <div class="slot-header"><span class="slot-label">Available Slots</span><button class="clear-all" onclick="clearAll()">Clear All</button></div>
                <div class="lockout-notice">* Same-day bookings must be made at least 1 hour in advance.</div>
                <div id="time-grid" class="time-grid"></div>
            </div>
            <div id="form-container">
                <input type="text" id="user-name" class="text-input" placeholder="Full Name">
                <input type="email" id="user-email" class="text-input" placeholder="uark-email@uark.edu">
                
                <!-- Partner Option Container -->
                <div id="group-container">
                    <div class="checkbox-container">
                        <input type="checkbox" id="has-partner" onchange="togglePartnerFields()">
                        <label for="has-partner">I am booking with a partner</label>
                    </div>

                    <div id="partner-box" class="partner-box">
                        <label>Partner Information (Max 1 Partner)</label>
                        <input type="text" id="partner-name" class="text-input" placeholder="Partner Full Name">
                        <input type="email" id="partner-email" class="text-input" placeholder="partner-email@uark.edu">
                    </div>
                </div>

                <button class="primary-btn" id="submit-btn" onclick="handleConfirm()">Complete Reservation</button>
            </div>
            <button class="secondary-btn" onclick="toggleView('manage')">Manage / Cancel Existing Booking</button>
        </div>

        <div id="manage-view">
            <div class="back-nav"><a onclick="toggleView('booking')">← Back to Booking</a></div>
            <h1>Your Bookings</h1>
            <input type="text" id="lookup-name" class="text-input" placeholder="Full Name">
            <input type="email" id="lookup-email" class="text-input" placeholder="uark-email@uark.edu">
            <button class="primary-btn" id="lookup-btn" onclick="lookupBookings()">Find My Bookings</button>
            <div id="results-container" style="margin-top: 30px; display: block;"><div id="results-list"></div></div>
        </div>
    </div>

    <!-- Rules Announcement Modal -->
    <div id="rules-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">Notice</h3>
            <p id="modal-message">Please read all rules and guidelines carefully before completing your reservation.</p>
            <button class="primary-btn" style="margin-top: 0;" onclick="closeRulesModal()">I Understand</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbweWbXj7Ga2Ns-DcfAboS7mKFkNCGGS83I8qrnnioaUxWlOwZvqKzZQH_ybK88Mz849OQ/exec"; 
        const params = new URLSearchParams(window.location.search);
        const printer = params.get('printer') || "Super9";
        let selectedIndices = [];

        // Increment this version string whenever you make changes to the rules list!
        const CURRENT_RULES_VERSION = "v1.3";

        const super9MondayTimes = ["01:00 PM - 02:30 PM", "02:30 PM - 03:00 PM", "03:00 PM - 03:30 PM", "03:30 PM - 04:00 PM", "04:00 PM - 04:30 PM"];
        const super9StandardTimes = ["01:00 PM - 01:30 PM", "01:30 PM - 02:00 PM", "02:00 PM - 02:30 PM", "02:30 PM - 03:00 PM", "03:00 PM - 03:30 PM", "03:30 PM - 04:00 PM", "04:00 PM - 04:30 PM"];
        const scaraTimes = ["09:00 AM - 11:00 AM", "10:00 AM - 12:00 PM", "01:00 PM - 03:00 PM", "02:00 PM - 04:00 PM"];

        function getTimesForDate(dateStr) {
            if (printer === "SCARA") return scaraTimes;
            if (!dateStr) return super9StandardTimes;
            
            const dateObj = new Date(dateStr + 'T00:00:00');
            const day = dateObj.getDay(); 
            return (day === 1) ? super9MondayTimes : super9StandardTimes;
        }

        const rules = {
            "Super9": [
                "<strong>Clay preparation is required every Monday from 1:00–2:30 PM.</strong>This task requires two individual students to sign up independently. Each student must book their own slot to help load clay for the week. If clay preparation is not necessary or available during a particular week, you will be notified beforehand via email or your professor.",
				"<strong>A maximum of two students may sign up for the Clay Prep slot.</strong>",
				"<strong>The two students who sign up for Clay Prep will have the option to receive printing time immediately following the Clay Prep session.</strong>Each student may receive one 30-minute session. If either student declines, or if the sessions are not filled by these two students, the two 30-minute sessions will open to the rest of the class at 11:00 AM that Monday.",
				"<strong>Because this is a shared space, the lab has a strict capacity limit and rules that coincide with that limit.</strong>Clay preparation and clay printing cannot happen at the same time. There may be a maximum of three students in the lab during Clay Prep. Wood paste prep and clay prep also cannot happen at the same time. There may be a maximum of five students in the lab specifically for printing and light computer work.",
				"<strong>If you are not approved to be in the space or the lab has already reached capacity, you will be asked to leave.",
                "<strong>Printing sessions are available in 30-minute increments.</strong>Students may book 30 or 60 minutes per session. A 60-minute session must consist of two back-to-back 30-minute sessions.",
                "<strong>Students may book printing sessions for themselves or for themselves and one partner.</strong>If booking with a partner, both students must be able to finish their prints and clean up by the end of the allotted time.",
                "<strong>Lunch, from 12:00–1:00 PM, is not bookable.</strong>",
                "<strong>Do not begin working in the lab if Lab Staff are not present.</strong>",
                "<strong>Sign up no later than one hour before you plan to print.</strong>",
                "<strong>Use the Manage/Cancel Existing Booking button at the bottom of the page to cancel or look up your appointment(s).</strong>Cancellations must be made at least one hour before your scheduled start time. If you are unable to cancel an appointment in time, you must email the staff at atcfablab@gmail.com to explain the reason.",
				"<strong>This lab maintains the same missed-appointment policies as the on-campus labs.</strong>Staff will email you after each missed appointment. If you miss three appointments, you will temporarily lose access to the space and machines.",
                "<strong>All work must end by 4:30 PM, including cleanup, to allow staff to begin shutting down the space and the rest of the shop.</strong> Assist with any cleaning necessary at the end of your printing session.",
                "<strong>If any other issues arise, contact atcfablab@gmail.com and we will help you as best we can.</strong>"
            ],
            "SCARA": [
                "<strong>All time slots include BOTH your mixing/loading & your printing time.</strong> All time slots are two (2) hours long.",
                "<strong>Tuesdays and Thursdays can be used for testing your mixes BEFORE booking an official time slot.</strong> These days do not have to be officially booked.",
                "<strong>There are NO consecutive sessions - you only get one session per day per group.</strong> This is to allow as many groups as possible to print in a day.",
                "<strong>When booking time, include your other group members' names.</strong>",
                "<strong>Lunch (12:00 - 1:00 PM) is not bookable.</strong>",
                "<strong>Sign up no later than one (1) hour before you plan to print.</strong>",
                "<strong>Use the Manage/Cancel Existing Booking button at the bottom of the page to cancel or look up your appointment(s).</strong> Cancellations must be made at least one (1) hour in advance of your booked starting time.",
                "<strong>All work must end at 4:30 PM to allow staff to begin shutting down the space and shop.</strong> Assist in any cleaning necessary at the end of your printing session.",
                "<strong>If any other issues arise, contact atcfablab@gmail.com & we will help you as best we can.</strong>"
            ]
        };

        document.getElementById('printer-title').innerText = "Reserve " + printer;
        rules[printer].forEach(text => {
            const li = document.createElement('li'); li.innerHTML = text;
            document.getElementById('rules-list').appendChild(li);
        });

        const dateInput = document.getElementById('date-picker');
        dateInput.setAttribute('min', new Date().toISOString().split('T')[0]);
        dateInput.onchange = () => renderGrid();

        function checkRulesNotice() {
            const savedVersion = localStorage.getItem('fablab_rules_version');
            const modal = document.getElementById('rules-modal');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-message');

            if (!savedVersion) {
                title.innerText = "Welcome to ATC FabLab!";
                msg.innerText = "Please read the 'Read Before Booking' section fully before proceeding with your reservation.";
                modal.style.display = 'flex';
            } else if (savedVersion !== CURRENT_RULES_VERSION) {
                title.innerText = "Rules Updated!";
                msg.innerText = "Our booking rules and policies have been updated. Please read the full guidelines carefully before reserving your slot.";
                modal.style.display = 'flex';
            }
        }

        function closeRulesModal() {
            localStorage.setItem('fablab_rules_version', CURRENT_RULES_VERSION);
            document.getElementById('rules-modal').style.display = 'none';
        }

        function togglePartnerFields() {
            const hasPartner = document.getElementById('has-partner').checked;
            document.getElementById('partner-box').style.display = hasPartner ? 'block' : 'none';
        }

        function isWithinLockout(dateStr, timeStr) {
            const nowInCentral = new Date(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', hour12: false, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }).format(new Date()));
            const startStr = timeStr.split(' - ')[0];
            const [time, modifier] = startStr.split(' ');
            let [hours, minutes] = time.split(':');
            hours = parseInt(hours);
            if (modifier === 'PM' && hours !== 12) hours += 12;
            if (modifier === 'AM' && hours === 12) hours = 0;
            const slotTime = new Date(`${dateStr}T${String(hours).padStart(2, '0')}:${minutes}:00`);
            return (slotTime - nowInCentral) < (60 * 60 * 1000);
        }

        async function renderGrid() {
            const grid = document.getElementById('time-grid');
            const selectedDate = dateInput.value;
            if (!selectedDate) return;

            const dateObj = new Date(selectedDate + 'T00:00:00');
            const day = dateObj.getDay();

            grid.innerHTML = "Checking availability...";
            document.getElementById('slot-container').style.display = "block";
            document.getElementById('form-container').style.display = "none";
            selectedIndices = [];

            if (printer === "Super9" && ![1, 3, 5].includes(day)) {
                grid.innerHTML = "<div style='grid-column: 1/-1; color:#ef4444; border:1px dashed #ef4444; padding:20px; border-radius:12px; font-weight:700;'>Super9 is only available on Mon, Wed, and Fri. Please select a valid date.</div>";
                return;
            }

            try {
                const response = await fetch(`${SCRIPT_URL}?action=getInitialData&printer=${printer}&date=${selectedDate}`);
                const initialData = await response.json();

                const isOnline = (initialData.status === "Online");
                const allBookings = initialData.history;

                if (!isOnline) {
                    grid.innerHTML = `<div style="grid-column: 1/-1; background: #fee2e2; color: #b91c1c; padding: 30px; border-radius: 15px; font-weight: 700;">⚠️ This printer is currently OFFLINE for maintenance.</div>`;
                    return;
                }

                grid.innerHTML = "";
                const times = getTimesForDate(selectedDate);

                const nowCentralStr = new Intl.DateTimeFormat('en-US', { 
                    timeZone: 'America/Chicago', 
                    year: 'numeric', month: '2-digit', day: '2-digit', 
                    hour: '2-digit', minute: '2-digit', hour12: false 
                }).format(new Date());

                const [datePart, timePart] = nowCentralStr.split(', ');
                const [m, d, y] = datePart.split('/');
                const todayStr = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
                const currentHour = parseInt(timePart.split(':')[0], 10);

                const isMonday = (day === 1);
                const isFutureDate = (selectedDate > todayStr);
                const isToday = (selectedDate === todayStr);

                const isPriorityLocked = isMonday && (isFutureDate || (isToday && currentHour < 11));

                times.forEach((timeStr, i) => {
                    const slot = document.createElement('div');
                    slot.className = 'time-slot';
                    slot.id = `slot-${i}`;

                    const bookingCount = allBookings.filter(b =>
                        b.printer === printer && b.date === selectedDate && b.time.includes(timeStr)
                    ).length;

                    const isClayPrep = (printer === "Super9" && isMonday && i === 0);
                    const isPriorityPrintingSlot = (printer === "Super9" && isMonday && (i === 1 || i === 2));
                    const maxCapacity = isClayPrep ? 2 : 1;
                    const isFull = bookingCount >= maxCapacity;

                    if (isClayPrep) {
                        const badge = document.createElement('span');
                        badge.className = 'clay-badge';
                        badge.innerText = `Clay Prep (${bookingCount}/2)`;
                        slot.appendChild(badge);
                    }

                    if (isFull) {
                        slot.classList.add('reserved');
                        slot.innerHTML += timeStr + " (Full)";
                    } else if (isWithinLockout(selectedDate, timeStr)) {
                        slot.classList.add('locked');
                        slot.innerHTML += timeStr;
                    } else if (isPriorityPrintingSlot && isPriorityLocked) {
                        slot.classList.add('locked');
                        slot.innerHTML += timeStr + " (Clay Prep Priority)";
                    } else {
                        slot.onclick = () => handleSelection(i, day);
                        slot.innerHTML += timeStr;
                    }
                    grid.appendChild(slot);
                });

            } catch (e) {
                grid.innerHTML = "Error loading slots.";
            }
        }

        function handleSelection(idx, day) {
            const isClayPrep = (printer === "Super9" && day === 1 && idx === 0);

            if (isClayPrep) {
                if (selectedIndices.includes(0)) {
                    selectedIndices = [];
                } else {
                    selectedIndices = [0];

                    const isSlot1Taken = document.getElementById('slot-1')?.classList.contains('reserved');
                    const isSlot2Taken = document.getElementById('slot-2')?.classList.contains('reserved');

                    let targetSlotIdx = null;
                    let slotTimeStr = "";

                    if (!isSlot1Taken) {
                        targetSlotIdx = 1;
                        slotTimeStr = "2:30 PM - 3:00 PM";
                    } else if (!isSlot2Taken) {
                        targetSlotIdx = 2;
                        slotTimeStr = "3:00 PM - 3:30 PM";
                    }

                    if (targetSlotIdx !== null) {
                        const acceptAutoBook = confirm(
                            `You selected Clay Prep (1:00 PM - 2:30 PM).\n\nWould you like to automatically add the next available 30-minute printing slot (${slotTimeStr}) for yourself?`
                        );

                        if (acceptAutoBook) {
                            selectedIndices.push(targetSlotIdx);
                        }
                    }
                }
            } else {
                if (selectedIndices.includes(0) && day === 1 && printer === "Super9") {
                    selectedIndices = [];
                }

                if (selectedIndices.includes(idx)) {
                    selectedIndices = selectedIndices.filter(i => i !== idx);
                } else {
                    if (selectedIndices.length === 0) {
                        selectedIndices.push(idx);
                    } else if (selectedIndices.length === 1) {
                        if (Math.abs(selectedIndices[0] - idx) === 1) {
                            selectedIndices.push(idx);
                        } else {
                            selectedIndices = [idx];
                        }
                    } else {
                        selectedIndices = [idx];
                    }
                }
                selectedIndices.sort((a, b) => a - b);
            }

            updateVisuals();
        }

        function updateVisuals() {
            const times = getTimesForDate(dateInput.value);
            
            const dateObj = new Date(dateInput.value + 'T00:00:00');
            const day = dateObj.getDay();

            times.forEach((_, i) => {
                const slot = document.getElementById(`slot-${i}`);
                if (slot && !slot.classList.contains('reserved') && !slot.classList.contains('locked')) {
                    slot.className = selectedIndices.includes(i) ? 'time-slot selected' : 'time-slot';
                }
            });

            if (selectedIndices.length > 0) {
                document.getElementById('form-container').style.display = 'block';

                const isClayPrepSelected = (printer === "Super9" && day === 1 && selectedIndices.includes(0));
                const groupContainer = document.getElementById('group-container');

                if (isClayPrepSelected) {
                    groupContainer.style.display = 'none';
                    document.getElementById('has-partner').checked = false;
                    document.getElementById('partner-box').style.display = 'none';
                } else {
                    groupContainer.style.display = 'block';
                }
            } else {
                document.getElementById('form-container').style.display = 'none';
            }
        }

        function clearAll() { 
            selectedIndices = []; 
            updateVisuals(); 
            document.getElementById('form-container').style.display = "none";
            document.getElementById('has-partner').checked = false;
            document.getElementById('partner-box').style.display = 'none';
        }

        function toggleView(view) {
            document.getElementById('booking-view').style.display = (view === 'booking') ? 'block' : 'none';
            document.getElementById('manage-view').style.display = (view === 'manage') ? 'block' : 'none';
        }

        async function handleConfirm() {
            const name = document.getElementById('user-name').value.trim();
            const email = document.getElementById('user-email').value.trim().toLowerCase();
            const hasPartner = document.getElementById('has-partner').checked;
            const partnerName = document.getElementById('partner-name').value.trim();
            const partnerEmail = document.getElementById('partner-email').value.trim().toLowerCase();
            const btn = document.getElementById('submit-btn'); 

            if (!name || !email) return alert("Please fill in both your full name and email.");

            const nameParts = name.split(/\s+/).filter(part => part.length > 0);
            if (nameParts.length < 2) {
                return alert("Please enter your full first and last name (e.g., Jane Doe).");
            }

            if (!email.endsWith('@uark.edu')) {
                return alert("⚠️ Access Restricted: You must use an official @uark.edu email address to complete a booking.");
            }

            // Partner Validation
            let groupInfo = "";
            if (hasPartner) {
                if (!partnerName || !partnerEmail) {
                    return alert("Please fill in both the full name and email address for your partner.");
                }

                const partnerNameParts = partnerName.split(/\s+/).filter(part => part.length > 0);
                if (partnerNameParts.length < 2) {
                    return alert("Please enter your partner's full first and last name (e.g., John Smith).");
                }

                if (!partnerEmail.endsWith('@uark.edu')) {
                    return alert("⚠️ Partner Email Restricted: Your partner must have an official @uark.edu email address.");
                }

                groupInfo = `${partnerName} (${partnerEmail})`;
            }

            btn.disabled = true; 
            btn.style.opacity = "0.7";
            btn.style.cursor = "not-allowed";
            btn.innerHTML = `<span class="spinner"></span> Verifying Reservation...`;

            const currentTimes = getTimesForDate(dateInput.value);

            const payload = { 
                action: 'book', 
                name, 
                email, 
                printer, 
                date: dateInput.value, 
                time: selectedIndices.map(i => currentTimes[i]).join(', '), 
                group: groupInfo
            };

            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json(); 

                if (result.status === "success") {
                    alert("Reservation Confirmed!");
                    window.location.href = "index.html";
                } else {
                    alert("⚠️ BOOKING STOPPED: " + result.message);
                    
                    btn.disabled = false;
                    btn.style.opacity = "1";
                    btn.style.cursor = "pointer";
                    btn.innerText = "Complete Reservation";
                    renderGrid();
                }
            } catch (e) { 
                console.error("Fetch Error:", e);
                alert("Error submitting booking. Please refresh and try again."); 
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.style.cursor = "pointer";
                btn.innerText = "Complete Reservation";
            }
        }

        async function lookupBookings() {
            const n = document.getElementById('lookup-name').value.trim().toLowerCase();
            const e = document.getElementById('lookup-email').value.trim().toLowerCase();
            const list = document.getElementById('results-list');
            if (!n || !e) return alert("Enter both name and email.");
            
            list.innerHTML = "<strong>Searching...</strong>";
            
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getHistory`);
                const all = await res.json();
                
                const filtered = all.filter(b => {
                    const primaryNameMatch = b.name && b.name.toLowerCase().includes(n);
                    const primaryEmailMatch = b.email && b.email.toLowerCase() === e;
                    
                    const groupInfo = (b.group || "").toLowerCase();
                    const partnerNameMatch = groupInfo.includes(n);
                    const partnerEmailMatch = groupInfo.includes(e);
                    
                    return (primaryNameMatch || partnerNameMatch) && (primaryEmailMatch || partnerEmailMatch);
                });
                
                if (filtered.length === 0) {
                    list.innerHTML = "<div style='color:red;'>No active bookings found for that name and email.</div>";
                    return;
                }
                
                list.innerHTML = filtered.map(b => {
                    const locked = isWithinLockout(b.date, b.time.split(' - ')[0]);
                    const partnerInfo = b.group ? `<br><small style="color:#6b7280;">Partner: ${b.group}</small>` : '';
                    
                    const dateObj = new Date(b.date + 'T00:00:00');
                    const isMonday = dateObj.getDay() === 1;
                    const isClayPrepSlot = (b.printer === "Super9" && isMonday && b.time.includes("01:00 PM - 02:30 PM"));
                    
                    const slotTag = isClayPrepSlot 
                        ? ' <span style="background:#f59e0b; color:#fff; font-size:0.65rem; padding:2px 6px; border-radius:6px; font-weight:800; text-transform:uppercase;">Clay Prep</span>' 
                        : '';

                    return `<div class="booking-item">
                        <div>
                            <strong>${b.printer}</strong>${slotTag}<br>
                            ${b.date} @ ${b.time}${partnerInfo}
                        </div>
                        <div>
                            ${locked ? '<span style="color:gray; font-size:0.7rem;">LOCKED</span>' : 
                            `<button class="cancel-btn" onclick="cancelBooking('${b.id}','${b.date}','${b.name.replace(/'/g, "\\'")}','${b.printer}','${b.time}')">Cancel</button>`}
                        </div>
                    </div>`;
                }).join('');
            } catch (err) {
                list.innerHTML = "Error connecting to server.";
            }
        }

        async function cancelBooking(id, date, name, printer, time) {
            if (!confirm("Are you sure you want to cancel this reservation?")) return;
            document.getElementById('results-list').innerHTML = "Cancelling...";
            try {
                const payload = { action: 'cancel', id, date, name, printer, time };
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                alert("Reservation cancelled successfully.");
                lookupBookings();
            } catch (e) {
                alert("Error cancelling booking.");
                lookupBookings();
            }
        }

        window.addEventListener('DOMContentLoaded', checkRulesNotice);
    </script>
</body>
</html>
